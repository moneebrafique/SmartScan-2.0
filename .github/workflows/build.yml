name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Needed to publish GitHub Releases (used by the in-app updater)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release key."
          else
            echo "No KEYSTORE_BASE64 secret - building with a temporary debug key (no auto-update release)."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          UPDATE_REPO: ${{ github.repository }}
        run: gradle assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/SmartScan-v1.0.${{ github.run_number }}.apk"
          git log -1 --pretty=%B > release_notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SmartScan-apk
          path: dist/*.apk

      # Only builds signed with YOUR key are published, so updates always install over the old app.
      - name: Publish release for in-app updates
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SmartScan 1.0.${{ github.run_number }}
          body_path: release_notes.txt
          files: dist/*.apk
          make_latest: true
